[workspace]
members = [
  "crates/ai-skills-core",
  "crates/ai-skills-store",
  "crates/ai-skills-library",
  "crates/ai-skills-search",
  "crates/ai-skills-source",
  "crates/ai-skills-sync",
  "crates/ai-skills-agents",
  "crates/ai-skills-llm",
  "crates/ai-skills-review",
  "crates/ai-skills-mcp",
  "crates/ai-skills-web",
  "crates/ai-skills-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Alexandre-Tortoza/ai-skills"

[workspace.lints.rust]
unsafe_code = "forbid"
