labels:
  # Issue classification.
  - { name: "type:epic", color: "5319E7", description: "Top-level outcome spanning multiple issues" }
  - { name: "type:feature", color: "1D76DB", description: "User-facing capability or enhancement" }
  - { name: "type:task", color: "D4C5F9", description: "Internal engineering task" }
  - { name: "type:bug", color: "D73A4A", description: "Defect or regression" }
  - { name: "type:skill", color: "0E8A16", description: "Skill or knowledge-library work" }
  - { name: "type:security", color: "B60205", description: "Security or trust-boundary work" }
  - { name: "type:docs", color: "0075CA", description: "Documentation-only work" }
  - { name: "type:research", color: "C2E0C6", description: "Investigation, spike, benchmark or design validation" }

  # Planning metadata. GitHub Projects is intentionally not used; these labels,
  # milestones and native issue relationships are the repository planning surface.
  - { name: "priority:P0", color: "B60205", description: "Critical path / must ship" }
  - { name: "priority:P1", color: "D93F0B", description: "Important after the critical path" }
  - { name: "priority:P2", color: "FBCA04", description: "Useful but deferrable" }

  - { name: "weight:1", color: "FFF3CD", description: "Fibonacci story weight 1" }
  - { name: "weight:2", color: "FFF3CD", description: "Fibonacci story weight 2" }
  - { name: "weight:3", color: "FFF3CD", description: "Fibonacci story weight 3" }
  - { name: "weight:5", color: "FFF3CD", description: "Fibonacci story weight 5" }
  - { name: "weight:8", color: "FFE69C", description: "Fibonacci story weight 8" }
  - { name: "weight:13", color: "FFD166", description: "Fibonacci story weight 13; decomposition review recommended" }
  - { name: "weight:21", color: "F4A261", description: "Epic or intentionally unsliced work" }

  - { name: "area:core", color: "0052CC", description: "Domain model and application architecture" }
  - { name: "area:library", color: "006B75", description: "Canonical skill/wiki library and Git-backed content" }
  - { name: "area:storage", color: "006B75", description: "SQLite, migrations, indexes and persistence" }
  - { name: "area:search", color: "5319E7", description: "FTS, embeddings, retrieval and ranking" }
  - { name: "area:mcp", color: "5319E7", description: "Model Context Protocol server and tools" }
  - { name: "area:api", color: "1D76DB", description: "HTTP API and contracts" }
  - { name: "area:cli", color: "0E8A16", description: "Command-line interface" }
  - { name: "area:sync", color: "0E8A16", description: "Repository configuration and materialization" }
  - { name: "area:agents", color: "0E8A16", description: "Agent/client integrations" }
  - { name: "area:llm", color: "BFDADC", description: "LLM providers and analysis" }
  - { name: "area:review", color: "BFDADC", description: "Proposal review and approval workflow" }
  - { name: "area:web", color: "FBCA04", description: "Web dashboard" }
  - { name: "area:security", color: "B60205", description: "Trust, authentication, authorization and supply chain" }
  - { name: "area:devops", color: "0366D6", description: "CI/CD, packaging and repository automation" }
  - { name: "area:docs", color: "0075CA", description: "Documentation and contributor guidance" }

  - { name: "status:triage", color: "EDEDED", description: "Needs prioritization or metadata assignment" }
  - { name: "status:blocked", color: "000000", description: "Blocked; dependency source of truth is GitHub blocked-by relationship" }
