labels:
  # Planning metadata (priority, area, weight, status, release and dates) belongs
  # in the single ai-skills Roadmap GitHub Project. Keep repository labels focused
  # on issue classification.
  - { name: "type:epic", color: "5319E7", description: "Top-level outcome spanning multiple issues" }
  - { name: "type:feature", color: "1D76DB", description: "User-facing capability or enhancement" }
  - { name: "type:task", color: "D4C5F9", description: "Internal engineering task" }
  - { name: "type:bug", color: "D73A4A", description: "Defect or regression" }
  - { name: "type:skill", color: "0E8A16", description: "Skill or knowledge-library work" }
  - { name: "type:security", color: "B60205", description: "Security or trust-boundary work" }
  - { name: "type:docs", color: "0075CA", description: "Documentation-only work" }
  - { name: "type:research", color: "C2E0C6", description: "Investigation, spike, benchmark or design validation" }
