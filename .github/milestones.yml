milestones:
  - number: 1
    title: "M0 - Foundation & Architecture"
    description: "Rust workspace, architecture boundaries, configuration, ADR process and development baseline. Target: 1-2 weeks."
  - number: 2
    title: "M1 - Canonical Skill Library & Persistence"
    description: "SKILL.md model, Git-backed canonical library, SQLite derived index, revisions and provenance. Target: 2 weeks."
  - number: 3
    title: "M2 - Search & Discovery"
    description: "FTS5, chunking, embeddings, hybrid retrieval, ranking and token accounting. Target: 2 weeks."
  - number: 4
    title: "M3 - MCP & HTTP API"
    description: "MCP server, search/get/list/propose tools, HTTP contracts, authentication boundaries and tests. Target: 2 weeks."
  - number: 5
    title: "M4 - Repository Sync & Agent Adapters"
    description: ".ai-skills resolution, global presets, trust-aware materialization, Claude/Codex/Cursor/Gemini adapters. Target: 2-3 weeks."
  - number: 6
    title: "M5 - LLM Review & Skill Evolution"
    description: "Provider abstraction, evidence, proposal/diff workflow, approval gate, third-party overlays and upstream reconciliation. Target: 2-3 weeks."
  - number: 7
    title: "M6 - Web Dashboard"
    description: "Vue management UI for library CRUD, discovery, profiles, repositories, proposals and statistics. Target: 2 weeks."
  - number: 8
    title: "M7 - Security, Reliability & Observability"
    description: "Threat model, authz, prompt-injection boundaries, concurrency, backups, audit, metrics and failure recovery. Target: 2 weeks."
  - number: 9
    title: "M8 - v0 Distribution & Release"
    description: "Packaging, installers, CI/CD, SBOM/provenance, release automation, documentation and compatibility validation. Target: 1-2 weeks."
