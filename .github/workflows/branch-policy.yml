name: Branch flow policy

on:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: branch-flow-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate promotion path
    runs-on: ubuntu-latest
    steps:
      - name: Validate source and target branches
        shell: bash
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail

          echo "Validating ${HEAD_REPOSITORY}:${HEAD_BRANCH} -> ${BASE_REPOSITORY}:${BASE_BRANCH}"

          case "$BASE_BRANCH" in
            dev)
              # Repository-owned issue work must use one of the supported prefixes.
              # Forks retain the same dev target for open-source contributions.
              if [[ "$HEAD_REPOSITORY" == "$BASE_REPOSITORY" ]]; then
                case "$HEAD_BRANCH" in
                  feature/*|fix/*|hotfix/*)
                    ;;
                  *)
                    echo "::error::dev only accepts feature/*, fix/*, or hotfix/* branches from this repository."
                    exit 1
                    ;;
                esac
              fi
              ;;

            main)
              if [[ "$HEAD_REPOSITORY" != "$BASE_REPOSITORY" || "$HEAD_BRANCH" != "dev" ]]; then
                echo "::error::main only accepts a completed-milestone promotion pull request from the repository dev branch."
                exit 1
              fi
              ;;

            *)
              echo "::error::Unexpected protected target branch: $BASE_BRANCH"
              exit 1
              ;;
          esac

          echo "Branch promotion path is valid."
