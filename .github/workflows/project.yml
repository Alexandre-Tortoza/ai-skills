name: Bootstrap and sync GitHub Project

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-project-bootstrap
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Verify Projects credential
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::Configure PROJECTS_TOKEN with a classic PAT that has the project scope."
            exit 1
          fi
          gh auth status
          gh project list --owner "$GITHUB_REPOSITORY_OWNER" --limit 1 >/dev/null || {
            echo "::error::PROJECTS_TOKEN cannot access user-owned GitHub Projects. Use a classic PAT with the project scope."
            exit 1
          }

      - name: Convert planning YAML to JSON
        run: ruby -ryaml -rjson -e 'puts JSON.generate(YAML.load_file(".github/project/planning.yml"))' > "$RUNNER_TEMP/planning.json"

      - name: Ensure Project, repository link and planning fields
        shell: bash
        run: |
          set -euo pipefail

          plan="$RUNNER_TEMP/planning.json"
          owner="$GITHUB_REPOSITORY_OWNER"
          repo_name="${GITHUB_REPOSITORY#*/}"
          title=$(jq -r '.project.title' "$plan")
          visibility=$(jq -r '.project.visibility // "PUBLIC"' "$plan")

          project_number=$(gh project list --owner "$owner" --format json --limit 100 | jq -r --arg title "$title" '.projects[] | select(.title == $title) | .number' | head -n1)
          if [[ -z "$project_number" ]]; then
            project_number=$(gh project create --owner "$owner" --title "$title" --format json --jq '.number')
          fi

          gh project edit "$project_number" --owner "$owner" \
            --visibility "$visibility" \
            --description "Delivery roadmap for ai-skills v0. Issue bodies are technical specifications; native relationships and Project fields hold planning metadata."
          gh project link "$project_number" --owner "$owner" --repo "$repo_name"

          ensure_field() {
            local name="$1" type="$2" options="${3:-}"
            if gh project field-list "$project_number" --owner "$owner" --format json --limit 100 | jq -e --arg name "$name" '.fields[] | select(.name == $name)' >/dev/null; then
              echo "field exists: $name"
              return
            fi

            if [[ "$type" == "SINGLE_SELECT" ]]; then
              gh project field-create "$project_number" --owner "$owner" \
                --name "$name" --data-type "$type" --single-select-options "$options" >/dev/null
            else
              gh project field-create "$project_number" --owner "$owner" \
                --name "$name" --data-type "$type" >/dev/null
            fi
          }

          ensure_field "Priority" "SINGLE_SELECT" "P0,P1,P2"
          ensure_field "Area" "SINGLE_SELECT" "Core,Library,Storage,Search,MCP,API,CLI,Sync,Agents,LLM,Review,Web,Security,DevOps,Docs"
          ensure_field "Weight" "NUMBER"
          ensure_field "Estimate (days)" "NUMBER"
          ensure_field "Target release" "SINGLE_SELECT" "v0,Post-v0"
          ensure_field "Start date" "DATE"
          ensure_field "Target date" "DATE"

          echo "$project_number" > "$RUNNER_TEMP/project_number"

      - name: Add roadmap issues and set Project fields
        shell: bash
        run: |
          set -euo pipefail

          plan="$RUNNER_TEMP/planning.json"
          project_number=$(cat "$RUNNER_TEMP/project_number")
          owner="$GITHUB_REPOSITORY_OWNER"
          release=$(jq -r '.project.target_release' "$plan")

          while IFS='|' read -r issue priority area weight estimate; do
            url="https://github.com/$GITHUB_REPOSITORY/issues/$issue"

            gh project item-add "$project_number" --owner "$owner" --url "$url" >/dev/null 2>&1 || true
            gh project item-edit "$project_number" --owner "$owner" --url "$url" --field "Status" --value "Todo"
            gh project item-edit "$project_number" --owner "$owner" --url "$url" --field "Priority" --value "$priority"
            gh project item-edit "$project_number" --owner "$owner" --url "$url" --field "Area" --value "$area"
            gh project item-edit "$project_number" --owner "$owner" --url "$url" --field "Weight" --number "$weight"
            gh project item-edit "$project_number" --owner "$owner" --url "$url" --field "Estimate (days)" --number "$estimate"
            gh project item-edit "$project_number" --owner "$owner" --url "$url" --field "Target release" --value "$release"

            echo "synced #$issue"
            sleep 0.15
          done < <(ruby -ryaml -e '
            p = YAML.load_file(".github/project/planning.yml")
            p.fetch("issues").each do |n, meta|
              puts [n, meta.fetch("priority"), meta.fetch("area"), meta.fetch("weight"), meta.fetch("estimate_days")].join("|")
            end
          ')

      - name: Verify Project population and repository link
        shell: bash
        run: |
          set -euo pipefail

          project_number=$(cat "$RUNNER_TEMP/project_number")
          owner="$GITHUB_REPOSITORY_OWNER"
          title=$(ruby -ryaml -e 'puts YAML.load_file(".github/project/planning.yml").fetch("project").fetch("title")')
          expected=$(ruby -ryaml -e 'puts YAML.load_file(".github/project/planning.yml").fetch("issues").size')
          actual=$(gh project item-list "$project_number" --owner "$owner" --format json --limit 500 --jq '.items | length')

          if (( actual < expected )); then
            echo "::error::Project contains $actual items; expected at least $expected."
            exit 1
          fi

          linked=$(gh repo view "$GITHUB_REPOSITORY" --json projectsV2 --jq --arg title "$title" '[.projectsV2.nodes[]? | select(.title == $title)] | length')
          [[ "$linked" != "0" ]] || {
            echo "::error::Project exists but is not linked to the repository."
            exit 1
          }

          echo "verified Project #$project_number with $actual items and repository link"

      - name: Remove legacy planning labels after successful migration
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r label; do
            [[ -z "$label" ]] && continue
            gh label delete "$label" --repo "$GITHUB_REPOSITORY" --yes
          done < <(gh label list --repo "$GITHUB_REPOSITORY" --limit 200 --json name --jq '.[].name | select(test("^(priority|weight|area|status):"))')

          project_number=$(cat "$RUNNER_TEMP/project_number")
          echo "Project #$project_number is configured and populated for v0."
