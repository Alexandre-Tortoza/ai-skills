name: Repository governance

on:
  push:
    branches: [main]
    paths:
      - .github/labels.yml
      - .github/milestones.yml
      - .github/workflows/governance.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Convert governance YAML to JSON
        shell: bash
        run: |
          set -euo pipefail
          ruby -ryaml -rjson -e 'puts JSON.generate(YAML.load_file(".github/labels.yml"))' > "$RUNNER_TEMP/labels.json"
          ruby -ryaml -rjson -e 'puts JSON.generate(YAML.load_file(".github/milestones.yml"))' > "$RUNNER_TEMP/milestones.json"

      - name: Synchronize labels and milestones
        uses: actions/github-script@v9
        env:
          LABELS_JSON: ${{ runner.temp }}/labels.json
          MILESTONES_JSON: ${{ runner.temp }}/milestones.json
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const labelConfig = JSON.parse(fs.readFileSync(process.env.LABELS_JSON, 'utf8'));
            const labels = labelConfig.labels ?? [];
            const existingLabels = await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner,
              repo,
              per_page: 100,
            });
            const labelsByName = new Map(existingLabels.map(label => [label.name, label]));

            for (const label of labels) {
              if (labelsByName.has(label.name)) {
                await github.rest.issues.updateLabel({
                  owner,
                  repo,
                  name: label.name,
                  new_name: label.name,
                  color: String(label.color).replace('#', ''),
                  description: label.description ?? '',
                });
                core.info(`updated label: ${label.name}`);
              } else {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: label.name,
                  color: String(label.color).replace('#', ''),
                  description: label.description ?? '',
                });
                core.info(`created label: ${label.name}`);
              }
            }

            const milestoneConfig = JSON.parse(fs.readFileSync(process.env.MILESTONES_JSON, 'utf8'));
            const milestones = milestoneConfig.milestones ?? [];
            const existingMilestones = await github.paginate(github.rest.issues.listMilestones, {
              owner,
              repo,
              state: 'all',
              per_page: 100,
            });
            const milestonesByTitle = new Map(existingMilestones.map(milestone => [milestone.title, milestone]));

            for (const milestone of milestones) {
              const existing = milestonesByTitle.get(milestone.title);
              if (existing) {
                await github.rest.issues.updateMilestone({
                  owner,
                  repo,
                  milestone_number: existing.number,
                  title: milestone.title,
                  description: milestone.description ?? '',
                  state: 'open',
                });
                core.info(`updated milestone #${existing.number}: ${milestone.title}`);
              } else {
                const created = await github.rest.issues.createMilestone({
                  owner,
                  repo,
                  title: milestone.title,
                  description: milestone.description ?? '',
                });
                core.info(`created milestone #${created.data.number}: ${milestone.title}`);
              }
            }
