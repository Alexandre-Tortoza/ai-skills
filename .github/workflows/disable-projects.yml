name: Disable repository Projects

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/disable-projects.yml

permissions:
  contents: read

jobs:
  disable:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.REPOSITORY_ADMIN_TOKEN }}
    steps:
      - name: Disable Projects repository feature
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::REPOSITORY_ADMIN_TOKEN is not configured."
            exit 1
          fi

          gh api --method PATCH "repos/$GITHUB_REPOSITORY" -F has_projects=false >/dev/null

          enabled=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.has_projects')
          if [[ "$enabled" != "false" ]]; then
            echo "::error::Projects is still enabled."
            exit 1
          fi

          echo "Repository Projects feature disabled."
