name: Sync issue planning metadata and relationships

on:
  push:
    branches: [main]
    paths:
      - .github/project/planning.yml
      - .github/labels.yml
      - .github/workflows/planning-sync.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-planning-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Convert planning YAML to JSON
        run: ruby -ryaml -rjson -e 'puts JSON.generate(YAML.load_file(".github/project/planning.yml"))' > "$RUNNER_TEMP/planning.json"

      - name: Synchronize parent/sub-issue and blocked-by relationships
        shell: bash
        run: |
          set -euo pipefail

          plan="$RUNNER_TEMP/planning.json"
          repo="$GITHUB_REPOSITORY"
          epic=$(jq -r '.project.epic' "$plan")

          api_post() {
            local endpoint="$1"
            shift

            for attempt in 1 2 3 4 5; do
              if gh api --method POST \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                "$endpoint" "$@" >/dev/null; then
                sleep 1.25
                return 0
              fi

              delay=$((attempt * 15))
              echo "mutation failed (attempt $attempt/5); retrying in ${delay}s: $endpoint" >&2
              sleep "$delay"
            done

            echo "mutation failed after retries: $endpoint" >&2
            return 1
          }

          # The default parent is the product Epic. Individual issues may declare
          # a nested parent, e.g. distribution issues under #64.
          while IFS='|' read -r issue parent; do
            [[ -z "$issue" || "$issue" == "$epic" ]] && continue
            [[ -z "$parent" || "$parent" == "null" ]] && parent="$epic"

            current_parent=$(gh api \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$repo/issues/$issue" \
              --jq '.parent.number // empty' 2>/dev/null || true)

            if [[ "$current_parent" == "$parent" ]]; then
              continue
            fi

            issue_id=$(gh api "repos/$repo/issues/$issue" --jq '.id')
            api_post "repos/$repo/issues/$parent/sub_issues" \
              -F sub_issue_id="$issue_id" \
              -F replace_parent=true
            echo "set parent of #$issue to #$parent"
          done < <(jq -r '.issues | to_entries[] | "\(.key)|\(.value.parent // empty)"' "$plan" | sort -t'|' -k1,1n)

          # Dependencies are additive so manually added relationships are not
          # silently removed. Every manifest prerequisite is guaranteed natively.
          while IFS='|' read -r issue deps; do
            [[ -z "$issue" || -z "$deps" ]] && continue

            existing=$(gh api \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$repo/issues/$issue/dependencies/blocked_by?per_page=100" \
              --jq '.[].number' | sort -n || true)

            IFS=',' read -ra blockers <<<"$deps"
            for blocker in "${blockers[@]}"; do
              [[ -z "$blocker" ]] && continue
              if grep -qx "$blocker" <<<"$existing"; then
                continue
              fi

              blocker_id=$(gh api "repos/$repo/issues/$blocker" --jq '.id')
              api_post "repos/$repo/issues/$issue/dependencies/blocked_by" \
                -F issue_id="$blocker_id"
              echo "#$issue blocked by #$blocker"
            done
          done < <(ruby -ryaml -e '
            p = YAML.load_file(".github/project/planning.yml")
            p.fetch("issues").each do |n, meta|
              deps = Array(meta["blocked_by"])
              puts "#{n}|#{deps.join(",")}" unless deps.empty?
            end
          ')

      - name: Synchronize priority area and Fibonacci weight labels
        shell: bash
        run: |
          set -euo pipefail

          plan="$RUNNER_TEMP/planning.json"
          repo="$GITHUB_REPOSITORY"

          while IFS='|' read -r issue priority area weight; do
            [[ -z "$issue" ]] && continue

            desired_priority="priority:$priority"
            desired_area="area:$(tr '[:upper:]' '[:lower:]' <<<"$area")"
            desired_weight="weight:$weight"

            current=$(gh issue view "$issue" --repo "$repo" --json labels --jq '.labels[].name')

            while IFS= read -r label; do
              [[ -z "$label" ]] && continue
              case "$label" in
                priority:*) [[ "$label" == "$desired_priority" ]] || gh issue edit "$issue" --repo "$repo" --remove-label "$label" ;;
                area:*)     [[ "$label" == "$desired_area" ]] || gh issue edit "$issue" --repo "$repo" --remove-label "$label" ;;
                weight:*)   [[ "$label" == "$desired_weight" ]] || gh issue edit "$issue" --repo "$repo" --remove-label "$label" ;;
              esac
            done <<<"$current"

            gh issue edit "$issue" --repo "$repo" \
              --add-label "$desired_priority" \
              --add-label "$desired_area" \
              --add-label "$desired_weight" >/dev/null

            echo "synced planning labels for #$issue"
          done < <(jq -r '.issues | to_entries[] | "\(.key)|\(.value.priority)|\(.value.area)|\(.value.weight)"' "$plan" | sort -t'|' -k1,1n)
