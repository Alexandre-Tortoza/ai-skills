name: Skill / Knowledge Proposal
description: Propose a canonical skill, knowledge page, source integration, or substantial skill evolution
title: "[Skill]: "
labels: ["type:skill", "status:triage"]
body:
  - type: input
    id: skill-name
    attributes:
      label: Skill name
      placeholder: rust-best-practices
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: Purpose, audience and activation context
      description: Explain who benefits, when an agent should discover/activate the skill, and why it belongs in durable knowledge.
    validations:
      required: true
  - type: dropdown
    id: origin
    attributes:
      label: Origin
      options:
        - First-party / user-authored
        - Organization-owned
        - Third-party Git/GitHub source
        - LLM-proposed evolution
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source, revision and provenance
      description: Link upstream repository, commit/tag, license, or evidence supporting the change.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Intended behavior / content
      description: Describe SKILL.md structure, supporting references/scripts/assets, discovery metadata, and expected agent behavior.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] Skill validates against the supported Agent Skills format.
        - [ ] Name/description enable accurate progressive disclosure.
        - [ ] Provenance and revision are recorded.
        - [ ] Discovery behavior is tested.
        - [ ] Activation does not silently exceed configured context budget.
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [P0, P1, P2]
    validations:
      required: true
  - type: dropdown
    id: weight
    attributes:
      label: Fibonacci story weight
      options: ["1", "2", "3", "5", "8", "13", "21"]
    validations:
      required: true
  - type: input
    id: estimate
    attributes:
      label: Estimated implementation time
      placeholder: e.g. 1 day, 2-3 days
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Trust, safety and update strategy
      description: Explain prompt-injection exposure, source trust, permissions, approval requirements, overlays, upstream updates and conflict strategy.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evaluation / evidence
      description: Explain how the skill's usefulness and correctness should be tested or evaluated.
    validations:
      required: true
