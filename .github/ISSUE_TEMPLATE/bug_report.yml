name: Bug Report
description: Report reproducible incorrect behavior in ai-skills
title: "[Bug]: "
labels: ["type:bug", "status:triage"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the observed behavior and impact.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ai-skills version / commit
      placeholder: v0.x.y or commit SHA
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: Linux x86_64, macOS arm64, Windows, WSL2, etc.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
  - type: checkboxes
    id: security
    attributes:
      label: Security check
      options:
        - label: This report does not contain credentials, API keys, private skill content, or an exploitable vulnerability that should be disclosed privately.
          required: true
