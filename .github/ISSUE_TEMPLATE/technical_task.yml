name: Technical Task
description: Track architecture, refactoring, infrastructure, testing or internal engineering work
title: "[Task]: "
labels: ["type:task"]
body:
  - type: markdown
    attributes:
      value: |
        Keep this form focused on engineering specification. Priority, Fibonacci weight, area, release, dates and dependencies are represented through GitHub Projects and native issue relationships.

  - type: textarea
    id: objective
    attributes:
      label: Objective and measurable outcome
      description: State the concrete engineering result and why it matters.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Technical context
      description: Explain current architecture, constraints, interfaces, invariants and evidence motivating the work.
    validations:
      required: true

  - type: textarea
    id: implementation
    attributes:
      label: Implementation notes
      description: Proposed components, modules, APIs, migrations, algorithms or sequencing. Guidance rather than a rigid prescription.
    validations:
      required: true

  - type: textarea
    id: deliverables
    attributes:
      label: Deliverables
      value: |
        - [ ] Code / infrastructure change
        - [ ] Automated tests
        - [ ] Documentation / ADR where applicable
        - [ ] Migration or compatibility notes where applicable
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Definition of done
      value: |
        - [ ] Acceptance behavior is objectively verifiable.
        - [ ] Critical paths and failure modes are tested.
        - [ ] Lint, formatting, static analysis and CI pass.
        - [ ] Security/trust boundaries have been reviewed.
        - [ ] No unresolved migration or backwards-compatibility risk remains.
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Validation and test strategy
      description: State how reviewers can prove the task is correct, including benchmarks/evals/security tests when relevant.
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: Risks / rollback
      description: Identify operational, security, data, migration, performance and rollback considerations.
    validations:
      required: true

  - type: textarea
    id: docs
    attributes:
      label: Documentation impact
      description: Identify docs, ADRs, runbooks, migration notes or examples that must change.
