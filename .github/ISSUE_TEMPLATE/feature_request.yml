name: Feature Request
description: Propose a new user-facing feature or enhancement for ai-skills
title: "[Feature]: "
labels: ["type:feature"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the capability, user value, architecture impact and measurable completion criteria. Planning metadata such as priority, Fibonacci weight, area, release and dates is maintained in GitHub Projects rather than duplicated in this form.

  - type: textarea
    id: problem
    attributes:
      label: Problem / opportunity
      description: What problem, limitation or workflow gap does this solve? Include concrete examples where useful.
    validations:
      required: true

  - type: textarea
    id: user-story
    attributes:
      label: User story
      value: |
        **As a** [user or agent]
        **I want to** [capability]
        **So that** [measurable outcome/value]
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      value: |
        **In scope**
        -

        **Out of scope**
        -
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution / technical direction
      description: Describe expected behavior, interfaces, data flow, persistence, compatibility requirements and relevant alternatives.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] Functional behavior is implemented end-to-end.
        - [ ] Critical behavior and failure modes are covered by automated tests.
        - [ ] Failure modes return actionable errors.
        - [ ] User-facing configuration/API behavior is documented.
        - [ ] Observability is added where operationally relevant.
    validations:
      required: true

  - type: textarea
    id: tests
    attributes:
      label: Test / evaluation strategy
      description: Unit, integration, contract, E2E, security, performance, compatibility, migration tests or evals expected.
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: Risks and security considerations
      description: Note prompt injection, supply chain, permissions, data loss, concurrency, compatibility, migration, performance or privacy risks.
    validations:
      required: true

  - type: textarea
    id: docs
    attributes:
      label: Documentation impact
      description: Identify README, user guide, MCP/tool docs, ADRs, migration notes or examples that should change.
